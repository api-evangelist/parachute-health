aid: parachute-health
name: Parachute Health
description: >-
  Parachute Health is the leading digital platform for durable medical equipment
  (DME), home medical equipment, and medical supply ePrescribing. Clinicians
  eSign and submit DME orders in seconds, and the platform coordinates in real
  time across a network of 3,000+ supplier locations, 270,000+ eSigning
  clinicians, and 70,000+ facilities in all 50 states. Parachute integrates with
  EHR/EMR systems (athenahealth, PointClickCare, Epic, and others) using HL7 2.x
  and FHIR interfaces, and offers prior-authorization automation, health-plan
  workflows, and value-based-care coordination. Integration is delivered as
  private, partner-provisioned EMR/HL7/FHIR interfaces rather than a public
  self-service developer API.
